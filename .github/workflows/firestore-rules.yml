name: 🔒 Firestore rules tests

# Runs firestore-tests/ against the Firestore emulator whenever the security
# rules or their tests change, so a rules edit can't quietly expose friends'
# health data. Uses a demo project ID: no real Firebase project, no secrets.
on:
  push:
    branches: [ main ]
    paths:
      - firestore.rules
      - firebase.json
      - firestore-tests/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    branches: [ main ]
    paths:
      - firestore.rules
      - firebase.json
      - firestore-tests/**
      - .github/workflows/firestore-rules.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version the team uses locally; bump together.
  FIREBASE_TOOLS_VERSION: 15.35.0

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: ☕️ Setup Java (emulator needs 21+)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 💾 Cache the Firestore emulator
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: 🔥 Install Firebase CLI
        run: npm install --global firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: 📥 Install test dependencies
        run: npm --prefix firestore-tests ci

      - name: ✅ Run rules tests on the emulator
        run: npm --prefix firestore-tests run test:emulator
